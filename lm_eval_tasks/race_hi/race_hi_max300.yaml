task: race_hi_max300
group: reading_comprehension
metadata:
  version: 2.0

dataset_path: csv
dataset_kwargs:
  data_files:
    test: ../custom_datasets/Race_Hindi/race_hi_test.csv

test_split: test
output_type: multiple_choice

doc_to_text: !function preprocess_race.doc_to_text
doc_to_target: !function preprocess_race.doc_to_target
doc_to_choice: !function preprocess_race.doc_to_choice

metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true

generation_kwargs:
  max_new_tokens: 300
