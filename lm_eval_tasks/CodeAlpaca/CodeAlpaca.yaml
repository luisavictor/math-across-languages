group:
  - code

task: codealpaca

dataset_path: csv
dataset_name: null

dataset_kwargs:
  data_files:
    test: ../custom_datasets/CodeAlpaca/codealpaca_test_filtered.csv

process_docs: !function CodeAlpaca.process_docs
process_results: !function CodeAlpaca.process_results

output_type: generate_until
test_split: test

doc_to_text: |
  Below is an instruction. Write an appropriate response.
  
  ### Instruction:
  {{prompt}}
  
  ### Response (Python code ONLY, NO Markdown, NO explanations):
  Your response MUST include Python function definitions instead of plain scripts (no top-level code, no prints).
  


doc_to_target: "{{completion}}"

num_fewshot: 0

metric_list:
  - metric: rougeL
    aggregation: mean
    higher_is_better: true

generation_kwargs:
  until:
    - "### Explanation"
    - "### Example"
    - "### Instruction"
    - "### Response"
    - "</s>"
    - "<|im_end|>"
  do_sample: false
