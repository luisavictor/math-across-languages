group:
  - code

task: codealpaca  # lowercase

dataset_path: csv
dataset_name: null

dataset_kwargs:
  data_files:
    test: /home/iailab34/selbacht0/Test_Lab/custom_datasets/codealpaca_test_clean.csv

process_docs: !function CodeAlpaca.process_docs
process_results: !function CodeAlpaca.process_results

output_type: generate_until
test_split: test

doc_to_text: |
  Below is an instruction. Write an appropriate response.

  ### Instruction:
  {{prompt}}

  ### Response:

doc_to_target: "{{completion}}"

num_fewshot: 0

metric_list:
  - metric: rougeL
    aggregation: mean
    higher_is_better: true

generation_kwargs:
  until:
    - "</s>"
    - "<|im_end|>"
  do_sample: false
